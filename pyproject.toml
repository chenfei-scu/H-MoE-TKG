[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmoe-tkg"
version = "1.0.0"
description = "Heterogeneous mixture-of-experts for temporal knowledge graph forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.1",
  "dgl>=1.1",
  "transformers>=4.35",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "umap-learn>=0.5.5",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

